<!doctype html>
<html lang="bn">\1
  <meta name="theme-color" content="#182b5b">
  <meta name="description" content="Personal Goal Tracker and Study Vault">
  <link rel="manifest" href="./manifest.webmanifest">

<title>Goal Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F9;--sf:#fff;--ink:#14244A;--mut:#66748F;--nv:#16295A;--gd:#D9A33B;--ln:#E1E7F0;--ok:#16905F;--wa:#B87A00;--bad:#D64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1428;--sf:#15203C;--ink:#E8EDF8;--mut:#93A1C0;--nv:#2B4590;--ln:#26335A;--ok:#46C894;--wa:#F0B33A;--bad:#FF7A7A}}
:root[data-theme="dark"]{--bg:#0C1428;--sf:#15203C;--ink:#E8EDF8;--mut:#93A1C0;--nv:#2B4590;--ln:#26335A;--ok:#46C894;--wa:#F0B33A;--bad:#FF7A7A}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Hind Siliguri",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 110px}
h2{font-size:19px;margin:6px 0;font-weight:700}.sub{color:var(--mut);font-size:14px}.empty{color:var(--mut);padding:18px 0;text-align:center}
.logo{display:flex;gap:10px;align-items:center;background:var(--sf);border-bottom:1px solid var(--ln);padding:12px 16px;width:calc(100% + 28px);margin:-14px -14px 4px}
.lg{width:42px;height:42px;border-radius:50%;background:var(--nv);color:var(--gd);display:grid;place-items:center;font:700 24px "Playfair Display",serif}
.logo b{font:700 24px/1 "Playfair Display",serif;color:var(--ink);letter-spacing:.04em}.logo i{color:var(--gd);font-style:normal}.logo small{display:block;color:var(--mut);font:italic 11px "Playfair Display",serif}
.hm{margin:8px 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.clock{background:var(--nv);color:#fff;text-align:center;border-radius:18px;padding:18px;margin:12px 0}
.clock #ck{font:700 56px/1.1 "Hind Siliguri";font-variant-numeric:tabular-nums}.clock .dt{color:var(--gd);font-size:20px;font-weight:700}.clock hr{border:0;border-top:1px solid #ffffff30;margin:14px 0}.clock b{letter-spacing:.12em;color:var(--gd);font-size:22px}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px;min-width:0;flex:1 1 120px}
textarea{width:100%;min-height:150px;resize:vertical}
.amt{width:100%;font-size:30px;font-weight:700;color:var(--ok);padding:12px;border-radius:14px}
button{font:500 15px "Hind Siliguri",sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--nv);color:#fff}
button.ghost{background:none;color:var(--bad);border:1px solid var(--bad)}button.pri{background:var(--nv)}
button.x{background:none;color:var(--mut);padding:2px 8px;font-size:22px}
button.w{width:100%;margin-top:10px;background:var(--gd);color:#14244A;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{background:var(--bg);color:var(--ink);border:1px solid var(--ln);padding:8px 12px}
.chip.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.tabs{display:flex;gap:4px;background:var(--ln);border-radius:12px;padding:4px}.tabs button{flex:1;background:none;color:var(--mut);padding:8px 2px;font-size:13px}.tabs button.on{background:var(--sf);color:var(--ink)}
.mod{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:8px 0}
.mod .ic{font-size:28px;background:color-mix(in srgb,var(--gd) 22%,transparent);border-radius:12px;width:48px;height:48px;display:grid;place-items:center;flex:none}
.mod b{display:block}.mod small{color:var(--mut)}
.tag{background:color-mix(in srgb,var(--nv) 14%,transparent);color:var(--ink);border-radius:6px;padding:1px 8px;font-size:13px;margin-right:6px}
.al{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px;border-left:4px solid}.al.wa{background:color-mix(in srgb,var(--wa) 14%,transparent);border-color:var(--wa)}.al.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:var(--bad)}
.big{font-size:38px;font-weight:700;line-height:1.1}.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}.bar i.wa{background:var(--wa)}.bar i.bad{background:var(--bad)}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.cnt div{border-radius:10px;text-align:center;padding:8px;font-size:22px;font-weight:700}.cnt small{display:block;font-size:12px;font-weight:400}
.cnt .ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}.cnt .wa{background:color-mix(in srgb,var(--wa) 14%,transparent)}.cnt .bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.cc{border-left:5px solid var(--ln)}.cc.ok{border-left-color:var(--ok)}.cc.wa{border-left-color:var(--wa)}.cc.bad{border-left-color:var(--bad)}
.ex{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;border-left:5px solid var(--ln)}.ex.u{border-left-color:var(--bad)}.ex.dn{opacity:.55}
.chk{width:28px;height:28px;padding:0;border-radius:8px;background:none;border:2px solid var(--mut);color:var(--ok);font-size:17px}
.bd{font-size:13px;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--nv) 14%,transparent);white-space:nowrap}.bd.u{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cal .day{background:var(--bg);color:var(--ink);padding:4px 0;min-height:42px;border-radius:8px}.cal .day.on{outline:2px solid var(--gd)}.cal small{display:block;color:var(--ok);font-size:11px}
a{color:var(--nv);word-break:break-all}#pm{font:700 52px "Hind Siliguri";font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--nv);color:#fff;padding:10px 16px;border-radius:12px}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.card{border-radius:22px}.al.ok2{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:14px;color:var(--ok);padding:14px}
.mod{border-radius:22px;padding:18px}.mod b{font-size:20px}.mod .ic{width:60px;height:60px;border-radius:18px;font-size:30px}
.pill{display:inline-block;border-radius:999px;padding:3px 14px;font-weight:500;margin-top:6px;color:var(--c)}.mod .ic,.pill{background:color-mix(in srgb,var(--c) 14%,transparent)}
.c-att{--c:#2F5BD8}.c-exp{--c:#15803D}.c-vault{--c:#B45309}.c-exam{--c:#D6385A}.c-notes{--c:#7C3AED}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}nav button{flex:1;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:6px 2px;opacity:.7}nav button span{font-size:24px}nav button.on{opacity:1;font-weight:700;color:var(--nv)}
</style></head><body><main></main>
<script>
const $=s=>document.querySelector(s),K='comeback.v1',WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const CATS=[['🍳','নাস্তা'],['🍚','দুপুর'],['🍛','সন্ধ্যা'],['🍲','রাত'],['☕','চা-কফি'],['🚌','যাতায়াত'],['📦','অন্যান্য']],TYPES=['কুইজ','অ্যাসাইনমেন্ট','ল্যাব রিপোর্ট','মিডটার্ম','পরীক্ষা'];
let S={dl:[],co:[],ex:[],bud:3000,vt:[],rt:[],nt:'',gl:[]},tab='home',arm='',csv='';
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),p2=n=>String(n).padStart(2,'0');
const ld=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),TD=ld(new Date());
let F={sub:'add',cat:'নাস্তা',cd:TD,mon:TD.slice(0,7),day:'',flt:'p',showDl:0,showCo:0};
const dt=x=>new Date(x.length===10?x+'T23:59:00':x),dleft=x=>Math.ceil((dt(x)-Date.now())/864e5);
const pct=c=>c.tot?c.a/c.tot*100:100,spare=c=>c.T?Math.floor(c.T*(1-c.min/100)+1e-9)-(c.tot-c.a):Math.floor(c.a*100/c.min-c.tot+1e-9);
const st=c=>!c.tot?'':c.T?(spare(c)<0?'bad':spare(c)<=1?'wa':'ok'):pct(c)<c.min?'bad':pct(c)<c.min+5?'wa':'ok',money=n=>'৳'+Math.round(n).toLocaleString();
const sum=a=>a.reduce((s,e)=>s+e.a,0),emo=n=>(CATS.find(c=>c[1]===n)||['📦'])[0];
function cd(d){const t=dt(d)-Date.now();if(t<=0)return 'সময় শেষ';const s=Math.floor(t/1e3),D=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return D>0?`${D}দিন ${p2(h)}ঘ ${p2(m)}মি`:`${p2(h)}:${p2(m)}:${p2(s%60)}`}
function tick(){const c=$('#ck');if(c)c.textContent=new Date().toLocaleTimeString('en-US');document.querySelectorAll('[data-d]').forEach(e=>e.textContent=cd(e.dataset.d))}
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const rb=n=>`<button class="ghost" data-a="rst" data-n="${n}">${arm===n?'নিশ্চিত?':'রিসেট'}</button>`;

const V={
home(){
 const A=sum(S.co.map(c=>({a:c.a}))),T=S.co.reduce((s,c)=>s+c.tot,0),up=S.dl.filter(x=>!x.done).sort((a,b)=>dt(a.d)-dt(b.d));
 const al=S.co.filter(c=>c.tot&&st(c)&&st(c)!=='ok').map(c=>{const b=st(c)==='bad';return `<div class="al ${b?'bad':'wa'}">${b?'🚨':'⚠️'} <b>${esc(c.n)}</b> উপস্থিতি ${pct(c).toFixed(1)}% (${b?c.min+'% এর নিচে!':'সেফ মার্জিন প্রায় শেষ'})</div>`}).join('')+up.slice(0,3).map(x=>`<div class="between">📅 <span style="flex:1"><b>${esc(x.t)}</b> <span class="sub">(${esc(x.ty||'')})</span></span><b data-d="${x.d}"></b></div>`).join('');
 const mon=S.ex.filter(e=>e.dt.startsWith(TD.slice(0,7)));
 const M=[['att','🎓','Attendance Tracker','এক-ক্লিক উপস্থিতি, ৮০% রুল ও সেফ বাংকিং মার্জিন।',`উপস্থিতি: ${(T?A/T*100:100).toFixed(1)}%`],['exp','💰','Daily Expense','খাবার, যাতায়াত ও দৈনন্দিন খরচ, বাজেট ও ক্যালেন্ডার।',`আজকের খরচ: ${sum(S.ex.filter(e=>e.dt===TD))} ৳`],['vault','📚','Study Vault & Routine','সাপ্তাহিক ক্লাস রুটিন ও ড্রাইভের বই/লেকচার শিট লিংক।','রুটিন ও রিসোর্স'],['exam','🎯','Exam & Deadlines','কুইজ, ল্যাব রিপোর্ট ও পরীক্ষার লাইভ কাউন্টডাউন।',up.length+' টি বাকি'],['notes','📝','Notes & Planner','ফোকাস টাইমার, গোল ও নোটপ্যাড','গোল ও নোট']];
 return `<div class="clock"><div id="ck"></div><div class="dt">${new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><hr><b>GOAL TRACKER</b></div>
 <div class="card"><b>🔔 গুরুত্বপূর্ণ নোটিশ ও রিমাইন্ডার (Alerts)</b>${al||'<div class="al ok2">✅ বর্তমানে কোনো জরুরি নোটিশ বা ঘাটতি নেই। সবকিছু স্বাভাবিক আছে!</div>'}</div>
 <h2>📌 আপনার স্টুডেন্ট হাব (Student Modules):</h2>`+M.map(m=>`<button class="mod" data-t="${m[0]}"><span class="ic c-${m[0]}">${m[1]}</span><span><b>${m[2]}</b><small>${m[3]}</small><br><span class="pill c-${m[0]}">${m[4]}</span></span></button>`).join('')},
att(){
 const A=S.co.reduce((s,c)=>s+c.a,0),T=S.co.reduce((s,c)=>s+c.tot,0),P=T?A/T*100:100,cl=P>=85?'ok':P>=80?'wa':'bad',n={ok:0,wa:0,bad:0};
 S.co.forEach(c=>c.tot&&n[st(c)]++);
 return `<div class="between"><h2>🎓 Attendance Tracker</h2><span><button data-a="showCo">+ কোর্স</button> ${rb('att')}</span></div>`+
 (F.showCo?`<form data-f="co" class="card"><div class="row"><input name="n" placeholder="কোড (APM 1201)" required><input name="nm" placeholder="কোর্সের নাম"><input name="T" type="number" min="1" required placeholder="মোট ক্লাস (যেমন 40)"><input name="m" type="number" min="1" max="99" placeholder="টার্গেট % (80)" aria-label="টার্গেট %"></div><button class="w">কোর্স যোগ করুন</button></form>`:'')+
 `<div class="card between"><span>📅 ক্লাসের তারিখ: <input type="date" data-a="cd" value="${F.cd}" style="flex:none"></span><span class="tag">${WD[new Date(F.cd+'T12:00').getDay()]}</span></div>
 <div class="card"><div class="between"><span class="sub">কোর্সের অবস্থা</span><span class="sub">${S.co.length}টি কোর্স</span></div><div class="cnt"><div class="ok">${n.ok}<small>নিরাপদ</small></div><div class="wa">${n.wa}<small>সতর্ক</small></div><div class="bad">${n.bad}<small>ঝুঁকি</small></div></div></div>`+
 (S.co.length?S.co.map(c=>{const p=pct(c),k=spare(c);let m;
  if(!c.tot)m='প্রথম ক্লাস মার্ক করুন।';else if(k>=0)m=k>0?`আরও ${k}টি ক্লাস সেফলি মিস দেওয়া যাবে।`:'এখন একটিও মিস দেওয়া যাবে না।';
  else if(c.T)m=(need=>need>c.T-c.tot?`${c.min}% ধরা আর সম্ভব নয়।`:`বাকি ${c.T-c.tot}টির মধ্যে কমপক্ষে ${need}টি ক্লাস করতে হবে।`)(Math.ceil(c.T*c.min/100-1e-9)-c.a);
  else m=`${c.min}% এ ফিরতে টানা ${Math.ceil((c.min*c.tot-100*c.a)/(100-c.min))}টি ক্লাস করুন।`;
  return `<div class="card cc ${st(c)}"><div class="between"><span><span class="tag">${esc(c.n)}</span><b>${esc(c.nm||'')}</b></span><button class="x" data-a="codel" data-i="${c.id}" aria-label="মুছুন">×</button></div><div class="big ${st(c)}">${c.tot?p.toFixed(1):'–'}%</div><div class="sub">${c.a}/${c.tot} ক্লাস হয়েছে • টার্গেট ${c.min}% • মোট ক্লাস: <input type="number" min="1" data-a="setT" data-i="${c.id}" value="${c.T||''}" placeholder="?" style="width:70px;flex:none;padding:3px 6px"></div><p>🧮 ${m}</p><div class="row"><button data-a="pres" data-i="${c.id}">✅ উপস্থিত</button><button class="ghost" data-a="abs" data-i="${c.id}">❌ অনুপস্থিত</button><button class="ghost" style="color:var(--mut);border-color:var(--ln)" data-a="undo" data-i="${c.id}">↩</button></div></div>`}).join(''):'<p class="empty">কোর্স যোগ করুন, তারপর কত ক্লাস মিস দেওয়া যাবে তা দেখুন।</p>')},
exp(){
 const mo=S.ex.filter(e=>e.dt.startsWith(F.mon)),tot=sum(mo),sub=F.sub;
 let b='';
 if(sub==='add')b=`<form data-f="ex" class="card"><label class="sub">টাকার পরিমাণ লিখুন:</label><input class="amt" id="amt" name="a" inputmode="decimal" placeholder="৳0" required>
 <div class="chips">${[10,20,50,100,200,500].map(n=>`<button type="button" class="chip" data-a="q" data-n="${n}">+${n} ৳</button>`).join('')}</div><div class="sub">খরচের খাত সিলেক্ট করুন:</div>
 <div class="chips">${CATS.map(([e,n])=>`<button type="button" class="chip ${F.cat===n?'on':''}" data-a="cat" data-n="${n}">${e} ${n}</button>`).join('')}</div>
 <div class="row"><input type="date" name="dt" value="${TD}"><input name="nt" placeholder="বিবরণ / নোট (ঐচ্ছিক)"></div><button class="w">সেভ করুন</button></form>`;
 if(sub==='list'){
  const [y,m]=F.mon.split('-').map(Number),nd=new Date(y,m,0).getDate(),f=new Date(y,m-1,1).getDay();let c='';
  for(let i=0;i<f;i++)c+='<i></i>';
  for(let d=1;d<=nd;d++){const ds=F.mon+'-'+p2(d),t=sum(mo.filter(e=>e.dt===ds));c+=`<button class="day ${F.day===ds?'on':''}" data-a="day" data-n="${ds}">${d}<small>${t||''}</small></button>`}

async function loadOCR(){
 if(window.Tesseract)return window.Tesseract;
 await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('OCR library load failed'));document.head.appendChild(s)});

async function shrink(f){try{const b=await createImageBitmap(f),r=Math.min(1,2200/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(x=>ok(x||f),'image/jpeg',.9))}catch(e){return f}}
const DAYWORDS=[[/রবিবার|রবি\.?|sunday/i,0],[/সোমবার|সোম\.?|monday/i,1],[/মঙ্গলবার|মঙ্গল\.?|tuesday/i,2],[/বুধবার|বুধ\.?|wednesday/i,3],[/বৃহস্পতিবার|বৃহস্পতি\.?|thursday/i,4],[/শুক্রবার|শুক্র\.?|friday/i,5],[/শনিবার|শনি\.?|saturday/i,6]];
function findDay(s){for(const [re,d] of DAYWORDS)if(re.test(s))return d;return -1}
function parseOCR(text){
 const lines=text.split(/\n+/).map(x=>x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean),out=[];let currentDay=-1;
 for(const line of lines){const d=findDay(line);if(d>=0)currentDay=d;
  const m=line.match(/(?:^|\s)(\d{1,2})\s*[:.]\s*(\d{2})(?:\s*(AM|PM))?/i);if(!m)continue;
  let h=+m[1],mi=+m[2];if(mi>59||h>23)continue;
  if(m[3]){if(h<1||h>12)continue;if(m[3].toUpperCase()==='PM'&&h<12)h+=12;if(m[3].toUpperCase()==='AM'&&h===12)h=0}
  const tm=p2(h)+':'+p2(mi);let s=line.slice(m.index+m[0].length).replace(/^[\s:.-]+/,'').trim();
  if(s.length<2)s='কোর্সের নাম ছবিতে পরিষ্কার নয়';if(currentDay>=0)out.push({day:currentDay,tm,s});
 }return out;
}
